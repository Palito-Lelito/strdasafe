<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07131d"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="app.css"></head><body>
<div id="map"></div><header><div class="brand"><b>STRADASAFE</b><small>LIGURIA · v0.6</small></div><div class="tools"><button id="sound">🔊</button><button id="locate">⌖</button></div></header>
<section id="search"><div class="searchrow"><input id="query" placeholder="Dove vuoi andare?" autocomplete="off"><button id="go">CERCA</button></div><div class="quick"><button data-q="Genova">Genova</button><button data-q="Savona">Savona</button><button data-q="La Spezia">La Spezia</button></div><div id="results"></div></section>
<section id="drive" class="hidden"><div class="maneuver"><span id="arrow">↑</span><div><b id="instruction">Percorso pronto</b><small id="road">Premi Avvia</small></div></div><div class="progress"><i id="progress"></i></div><div class="metrics"><div><strong id="speed">0</strong><small>km/h</small></div><div><strong id="distance">–</strong><small>restanti</small></div><div><strong id="eta">–</strong><small>arrivo</small></div><div class="limit"><strong id="limit">–</strong></div></div><div id="alert" class="alert hidden">⚠ Deviazione rilevata, ricalcolo…</div><button id="start">AVVIA NAVIGAZIONE</button><button id="stop" class="sub">TERMINA</button></section>
<footer><span id="status">In attesa del GPS…</span><span>© OpenStreetMap contributors</span></footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
