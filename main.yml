name: Compila APK StradaSafe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verifica Gradle
        run: gradle --version

      - name: Compila APK Debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: StradaSafe-Liguria-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
